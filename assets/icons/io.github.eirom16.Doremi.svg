<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA"/>
      <stop offset="100%" style="stop-color:#7C4DFF"/>
    </linearGradient>
    <linearGradient id="note" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0d4ff"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Subtle glow -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#accent)" opacity="0.15"/>
  <!-- Music note (beamed eighth notes) -->
  <g transform="translate(256,256) scale(1.1) translate(-256,-256)">
    <!-- Beam connecting the two notes -->
    <rect x="185" y="128" width="160" height="24" rx="4" fill="url(#note)"/>
    <!-- Left stem -->
    <rect x="185" y="128" width="16" height="200" rx="4" fill="url(#note)"/>
    <!-- Right stem -->
    <rect x="329" y="128" width="16" height="168" rx="4" fill="url(#note)"/>
    <!-- Left note head -->
    <ellipse cx="170" cy="340" rx="48" ry="36" transform="rotate(-15, 170, 340)" fill="url(#note)"/>
    <!-- Right note head -->
    <ellipse cx="314" cy="308" rx="48" ry="36" transform="rotate(-15, 314, 308)" fill="url(#note)"/>
  </g>
  <!-- Subtle sound waves (right side) -->
  <path d="M380,220 Q400,256 380,292" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <path d="M400,200 Q430,256 400,312" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
  <path d="M420,184 Q460,256 420,328" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.25"/>
</svg>
