[package]
name = "doremi"
version = "2.0.0"
description = "Cliente de escritorio para YouTube Music - Linux"
edition = "2021"
authors = ["Eirom"]

[lib]
name = "doremi_core"
path = "src/lib.rs"

[[bin]]
name = "doremi"
path = "src/main.rs"

[dependencies]
cxx = "1.0"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
once_cell = "1"
thiserror = "2"
regex = "1"
image = "0.25"
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
rayon = "1"
vlc-rs = "0.3.0"
rand = "0.10.1"
rusqlite = { version = "0.31", features = ["bundled"] }
ctrlc = "3.4"
zbus = { version = "4", features = ["tokio"] }
discord-rich-presence = "1.1.0"
md5 = "0.8.0"

[build-dependencies]
cxx-build = "1.0"
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
